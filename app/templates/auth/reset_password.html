{% extends "base.html" %}
{% from "_macros.html" import field %}

{% block content %}
<div class="narrow">
  <div class="card">
    <h1>새 비밀번호 정하기</h1>
    <form method="post" novalidate>
      {{ form.hidden_tag() }}
      {{ field(form.password, autofocus=true) }}
      {{ field(form.password2) }}
      {{ form.submit(class="btn btn--primary btn--block") }}
    </form>
  </div>
</div>
{% endblock %}
